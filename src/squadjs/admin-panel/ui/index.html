<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Miabeyefendi">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-build="TWlhYmV5ZWZlbmRp">
<!-- 4d69616265796566656e6469 -->
<div class="login" id="login" hidden>
  <form class="tile" id="loginform">
    <h1>Sign in</h1>
    <label>Name<input class="field" name="name" autocomplete="username" required></label>
    <label>Password<input class="field" name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginerr" role="alert"></p>
    <button class="btn pri tall">Sign in</button>
  </form>
  <footer class="credit">Made by Miabeyefendi</footer>
</div>

<div class="login" id="setup" hidden>
  <form class="tile" id="setupform" novalidate>
    <h1>Set your sign in</h1>
    <p class="sub" style="margin:0">This password is temporary. Choose your own before you use the panel.</p>
    <label>User name<input class="field" name="name" autocomplete="username" required></label>
    <label>Current password<input class="field" name="currentPassword" type="password" autocomplete="current-password" required></label>
    <label>New password (10 characters or more)<input class="field" name="newPassword" type="password" autocomplete="new-password" required></label>
    <label>New password again<input class="field" name="repeat" type="password" autocomplete="new-password" required></label>
    <p class="err" id="setuperr" role="alert"></p>
    <button class="btn pri tall">Save and continue</button>
    <button type="button" class="btn ghost" id="setupout">Sign out</button>
  </form>
  <footer class="credit">Made by Miabeyefendi</footer>
</div>

<div class="app" id="app" hidden>
<nav class="side" aria-label="Main">
  <div class="brand"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>Squad Admin</div>
  <button class="nb" data-view="overview" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>Overview</button>
  <div class="grp">Live</div>
  <button class="nb" data-view="score"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Scoreboard</button>
  <button class="nb" data-view="players"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>Players &amp; squads</button>
  <button class="nb" data-view="map"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
  <div class="grp">Control</div>
  <button class="nb" data-view="shuffle"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Smart Shuffle</button>
  <button class="nb" data-view="rules" data-need="rules.view"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>Rules</button>
  <button class="nb" data-view="plugins" data-need="plugins"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4M7 7h10v5a5 5 0 01-10 0zM12 17v4"/></svg>Plugins</button>
  <div class="grp">Records</div>
  <button class="nb" data-view="records" data-need="records"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Records</button>
  <button class="nb" data-view="logs"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Logs<span class="cnt" id="tkcount" hidden></span></button>
  <div class="grp" data-need="staff">Access</div>
  <button class="nb" data-view="staff" data-need="staff"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M18 8v6M15 11h6"/></svg>Staff</button>
  <button class="nb" data-view="ranks" data-need="ranks.edit"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l2 2 3-3M4 17l2 2 3-3M13 7h7M13 18h7"/></svg>Ranks</button>
  <div style="flex:1;min-height:20px"></div>
  <div style="display:flex;flex-direction:column;gap:10px;padding:12px 4px 0;border-top:1px solid var(--line)">
    <div class="themes" role="group" aria-label="Theme"><button data-theme-set="light" aria-pressed="false">Light</button><button data-theme-set="system" aria-pressed="true">Auto</button><button data-theme-set="dark" aria-pressed="false">Dark</button></div>
    <div style="display:flex;flex-direction:column;padding:0 8px"><span style="font-weight:600" id="me-name"></span><span class="sub xs" id="me-role"></span></div><div class="mebtns"><button class="btn" id="myaccount">My account</button><button class="btn" id="signout">Sign out</button></div>
  </div>
</nav>

<main>
  <header class="top">
    <div style="flex:1 1 260px;display:flex;flex-direction:column;gap:3px"><h1 id="vtitle">Overview</h1><span class="sub" id="subtitle"></span></div>
    <div role="status" style="display:flex;flex-wrap:wrap;gap:8px"><span class="pill"><span class="live off" id="livedot" aria-hidden="true"></span><span id="livetext">Connecting</span></span><span class="pill mono" id="pcount"></span><span class="pill" id="pqueue"></span></div>
    <button class="btn pri" data-act="message" data-need="message">Send message</button>
  </header>

  <section class="view on" id="view-overview" aria-label="Overview"></section>
  <section class="view" id="view-score" aria-label="Scoreboard"></section>
  <section class="view" id="view-players" aria-label="Players and squads"></section>
  <section class="view" id="view-map" aria-label="Map"></section>
  <section class="view" id="view-shuffle" aria-label="Smart Shuffle"></section>
  <section class="view" id="view-rules" aria-label="Rules"></section>
  <section class="view" id="view-plugins" aria-label="Plugins"></section>
  <section class="view" id="view-records" aria-label="Records"></section>
  <section class="view" id="view-logs" aria-label="Logs"></section>
  <section class="view" id="view-staff" aria-label="Staff"></section>
  <section class="view" id="view-ranks" aria-label="Ranks"></section>
  <footer class="credit">Made by Miabeyefendi</footer>
</main>
</div>

<dialog id="dlg-player" aria-labelledby="pn" style="width:min(560px,calc(100vw - 32px))"><div class="dlg" id="playercard"></div></dialog>

<dialog id="dlg-act" aria-labelledby="act-title"><form class="dlg" id="actform" novalidate>
  <h2 id="act-title"></h2>
  <p class="sub" id="act-text" style="margin:0;overflow-wrap:anywhere"></p>
  <div id="act-body"></div>
  <div id="act-fields"></div>
  <p class="err" id="act-err" role="alert"></p>
  <div class="right"><button type="button" class="btn ghost" id="act-cancel">Cancel</button><button class="btn pri" id="act-ok">Confirm</button></div>
</form></dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js" type="module"></script>
</body>
</html>
